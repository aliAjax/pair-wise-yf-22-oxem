spring.application.name=quality-trace
server.port=${PORT:8080}

# 当前演示实现使用内存仓储（database/init.sql 给出目标关系模型）。
# 排除数据源/JPA/MyBatis 自动装配，使服务在无数据库环境也可启动；接入 PostgreSQL 时移除下列排除项即可。
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration

# 完工收尾韧性演练开关：处理到该批次序号(0起)模拟一次写入失败，-1 关闭；测试中显式打开
finalization.fail-at-batch-index=${FINALIZATION_FAIL_AT_BATCH_INDEX:-1}
finalization.fail-once=${FINALIZATION_FAIL_ONCE:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
